<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MEDIC'S – Simulateur de cas cliniques</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved (or system) theme before the first paint to avoid a flash. */
    (function () {
      var theme = "light";
      try {
        theme = localStorage.getItem("cas-zero:theme") ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
      /* The opening animation plays once per visit, not every time the menu is reopened. */
      if (sessionStorage.getItem("medics:splash")) document.documentElement.classList.add("no-splash");
      else sessionStorage.setItem("medics:splash", "1");
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <svg class="splash-logo" viewBox="0 0 96 96" width="132" height="132">
        <defs>
          <linearGradient id="splashGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#10b981"/>
            <stop offset="1" stop-color="#2563eb"/>
          </linearGradient>
        </defs>
        <rect class="sl-bg" width="96" height="96" rx="24" fill="url(#splashGrad)"/>
        <path class="sl-m" pathLength="100" d="M20 68V30L36 54L48 22L60 54L76 30V68" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="sl-ring" cx="48" cy="22" r="4" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
      <div class="splash-word"><span style="--i:0">M</span><span style="--i:1">E</span><span style="--i:2">D</span><span style="--i:3">I</span><span style="--i:4">C</span><span style="--i:5">'</span><span style="--i:6">S</span></div>
      <div class="splash-tag">Du symptôme au diagnostic.</div>
    </div>
    <div class="splash-skip">Touchez pour passer</div>
  </div>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <ol class="tracker" id="tracker"></ol>
      <div class="topbar-tools">
        <button type="button" class="theme-toggle" id="themeToggle"></button>
        <button type="button" class="theme-toggle menu-btn" id="menuButton"></button>
      </div>
      <div class="score" id="score" aria-live="polite">
        <span class="score-label" id="scoreLabel"></span>
        <span class="score-value" id="scoreValue">100</span><span class="score-max">/100</span>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="current-name" id="currentName"></div>
    <div class="monitor" id="monitor" role="group" hidden></div>
  </header>

  <main id="stage" class="stage"></main>
  <div id="toastLayer" class="toast-layer" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
